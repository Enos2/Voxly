<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxly • Your Voice Your Stage</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/voxly-logo.png" type="image/png" />
</head>
<body>
  <div class="container">

    <!-- HEADER / LOGO -->
    <header class="header">
      <img src="assets/voxly-logo.png" alt="Voxly Logo" class="logo" />
      <h1>Voxly</h1>
      <p class="subtitle">Your voice. Your stage.</p>
    </header>

    <!-- AUTHENTICATION AREA -->
    <section class="auth-card">
      <h2>Account</h2>
      <div class="auth-forms">

        <!-- Register -->
        <div class="auth-block" id="registerBlock">
          <h3>Register</h3>
          <input id="reg-name" type="text" placeholder="Full name" />
          <input id="reg-email" type="email" placeholder="Email" />
          <input id="reg-password" type="password" placeholder="Password" />
          <button onclick="handleRegister()">Register</button>
        </div>

        <!-- Login -->
        <div class="auth-block" id="loginBlock">
          <h3>Login</h3>
          <input id="login-email" type="email" placeholder="Email" />
          <input id="login-password" type="password" placeholder="Password" />
          <button onclick="handleLogin()">Login</button>
        </div>

        <!-- Logout -->
        <div class="auth-block" id="logoutBlock" style="display:none;">
          <h3 id="welcomeUser">Welcome Back</h3>
          <button onclick="handleLogout()">Logout</button>
        </div>

      </div>
    </section>

    <!-- AUDIO PLAYER (HIDDEN UNTIL LOGIN) -->
    <main class="card" id="audioSection" style="display:none;">
      <div class="list-area">
        <label for="trackSelect" class="label">Available Tracks</label>
        <select id="trackSelect" aria-label="Select track">
          <option value="">Loading tracks…</option>
        </select>
      </div>

      <div class="player-area">
        <div class="cover-art">
          <div class="vinyl"></div>
        </div>
        <audio id="audioPlayer" controls preload="none"></audio>
        <div id="nowPlaying" class="now-playing">Not playing</div>
      </div>

      <div id="status" class="status"></div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <small>Voxly • Backend: localhost:5000</small>
    </footer>

  </div>

  <script src="script.js"></script>
  <script>
    // Hide audio section until user is logged in
    function showAudioSection() {
      document.getElementById("audioSection").style.display = "flex";
    }

    function hideAudioSection() {
      document.getElementById("audioSection").style.display = "none";
    }
  </script>
</body>
</html>
