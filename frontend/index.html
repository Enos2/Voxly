<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voxly • Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">

    <!-- HEADER / LOGO -->
    <header class="header">
      <img src="assets/voxly-logo.png" alt="Voxly Logo" class="logo" />
      <h1>Voxly</h1>
      <p class="subtitle">Your voice. Your stage.</p>
    </header>

    <!-- AUTHENTICATION AREA -->
    <section class="auth-card" id="authCard">
      <h2>Account</h2>

      <!-- Register -->
      <div class="auth-block" id="registerBlock">
        <h3>Register</h3>
        <input id="reg-name" type="text" placeholder="Full name" />
        <input id="reg-email" type="email" placeholder="Email" />
        <input id="reg-password" type="password" placeholder="Password" />
        <button onclick="handleRegister()">Register</button>
      </div>

      <!-- Login -->
      <div class="auth-block" id="loginBlock">
        <h3>Login</h3>
        <input id="login-email" type="email" placeholder="Email" />
        <input id="login-password" type="password" placeholder="Password" />
        <button onclick="handleLogin()">Login</button>
      </div>
    </section>

    <!-- LOGOUT BUTTON -->
    <button id="logoutBtn" onclick="handleLogout()">Logout</button>

    <!-- AUDIO PLAYER -->
    <main class="card" id="playerCard">
      <div class="list-area">
        <label for="trackSelect" class="label">Available Tracks</label>
        <select id="trackSelect" aria-label="Select track">
          <option value="">Loading tracks…</option>
        </select>
      </div>

      <div class="player-area">
        <div class="cover-art">
          <div class="vinyl"></div>
        </div>
        <audio id="audioPlayer" controls preload="none"></audio>
        <div id="nowPlaying" class="now-playing">Not playing</div>
      </div>

      <div id="status" class="status"></div>
    </main>

    <footer class="footer">
      <small>Voxly • Backend: localhost:5000</small>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
